<!doctype html>
<meta charset="utf-8">
<title>PKON converter</title>
<body style="font-family:sans-serif;max-width:40em;margin:2em auto">
<h2>PKON converter (local)</h2>
<p><b>Image → .pkon</b> (PNG or JPEG, 8-bit)</p>
<input type="file" id="img" accept=".png,.jpg,.jpeg,image/png,image/jpeg">
<button onclick="go('convert','img','.pkon')">Convert to PKON</button>
<p><b>.pkon → PNG</b></p>
<input type="file" id="pk" accept=".pkon,.pkon2">
<button onclick="go('restore','pk','.png')">Restore to PNG</button>
<hr>
<h3>PKON Viewer</h3>
<p>View a <b>.pkon</b> file directly in a new tab (the file is not converted or changed).</p>
<input type="file" id="vw" accept=".pkon,.pkon2">
<button onclick="view()">View in New Tab</button>
<p id="status"></p>
<script>
async function go(op, id, ext) {
  const st = document.getElementById('status'), f = document.getElementById(id).files[0];
  if (!f) { st.textContent = 'Choose a file first.'; return; }
  st.textContent = 'Processing ' + f.name + ' (' + f.size + ' bytes)... large images can take a while.';
  try {
    const r = await fetch('/' + op, { method: 'POST', body: f });
    if (!r.ok) { st.textContent = 'Error: ' + await r.text(); return; }
    const b = await r.blob(), name = f.name.replace(/\.[^.]*$/, '') + ext;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.textContent = 'Download ' + name;
    st.textContent = 'Done: ' + r.headers.get('X-Info') + '. Input ' + f.size + ' bytes → output ' + b.size + ' bytes. ';
    st.appendChild(a);
  } catch (e) { st.textContent = 'Error: ' + e; }
}
// The tab is opened synchronously from the click; it asks us ('ready') for the data, which is posted
// to it same-origin, so nothing large goes through the URL.
function view() {
  const st = document.getElementById('status'), f = document.getElementById('vw').files[0];
  if (!f) { st.textContent = 'Choose a file first.'; return; }
  const w = window.open('/viewer', '_blank');
  if (!w) { st.textContent = 'The browser blocked the new tab. Allow pop-ups for this page and try again.'; return; }
  st.textContent = 'Opened viewer for ' + f.name + '.';
  const msg = (async () => {
    try {
      const r = await fetch('/view-data', { method: 'POST', body: f });
      if (!r.ok) return { error: await r.text() };
      const h = n => parseInt(r.headers.get(n), 10);
      return { name: f.name, size: f.size, width: h('X-Width'), height: h('X-Height'), channels: h('X-Channels'),
               codec: h('X-Codec'), info: r.headers.get('X-Info'), pixels: await r.arrayBuffer() };
    } catch (e) { return { error: 'Request failed: ' + e }; }
  })();
  const onMsg = async ev => {
    if (ev.origin !== location.origin || ev.source !== w || !ev.data || ev.data.type !== 'ready') return;
    window.removeEventListener('message', onMsg);
    const m = await msg;
    w.postMessage(m, location.origin, m.pixels ? [m.pixels] : []);
  };
  window.addEventListener('message', onMsg);
}
</script>
