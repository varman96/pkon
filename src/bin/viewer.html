<!doctype html>
<meta charset="utf-8">
<title>PKON Viewer</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px sans-serif}
body{display:flex;flex-direction:column}
#bar{padding:6px 12px;background:#1b1b1b;border-bottom:1px solid #333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;object-fit:contain;display:none}
#err{color:#f88;padding:2em;max-width:40em;white-space:pre-wrap}
</style>
<div id="bar">Loading…</div>
<div id="stage"><canvas id="c"></canvas><div id="err"></div></div>
<script>
const bar = document.getElementById('bar'), err = document.getElementById('err'), cv = document.getElementById('c');
function fail(t) { bar.textContent = 'PKON Viewer'; cv.style.display = 'none'; err.textContent = 'Cannot display this file: ' + t; }
function show(m) {
  if (!m || m.error) return fail(m ? m.error : 'no data received');
  const {width: w, height: h, channels: c, pixels} = m;
  if (!(w > 0 && h > 0 && c >= 1 && c <= 4) || !(pixels instanceof ArrayBuffer)) return fail('invalid image metadata');
  if (pixels.byteLength !== w * h * c) return fail('pixel data length ' + pixels.byteLength + ' does not match ' + w + 'x' + h + 'x' + c);
  if (w > 32767 || h > 32767 || w * h > 268435456) return fail('image too large for a browser canvas (' + w + 'x' + h + ')');
  const src = new Uint8Array(pixels), img = new ImageData(w, h), d = img.data;
  for (let i = 0, n = w * h; i < n; i++) {
    const s = i * c, o = i * 4;
    if (c === 1) { d[o] = d[o+1] = d[o+2] = src[s]; d[o+3] = 255; }
    else if (c === 2) { d[o] = d[o+1] = d[o+2] = src[s]; d[o+3] = src[s+1]; }
    else { d[o] = src[s]; d[o+1] = src[s+1]; d[o+2] = src[s+2]; d[o+3] = c === 4 ? src[s+3] : 255; }
  }
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (!ctx) return fail('canvas unavailable');
  ctx.putImageData(img, 0, 0);
  cv.style.display = 'block'; err.textContent = '';
  bar.textContent = m.name + ' — ' + w + '×' + h + ', ' + m.info.replace(/^\d+ /, '') + ' — .pkon ' + m.size.toLocaleString() + ' bytes (codec ' + m.codec + ')';
  document.title = m.name + ' – PKON Viewer';
}
if (!window.opener) fail('open this viewer from the PKON converter page (View in New Tab).');
else {
  window.addEventListener('message', ev => {
    if (ev.origin === location.origin && ev.source === window.opener) show(ev.data);
  }, {once: true});
  window.opener.postMessage({type: 'ready'}, location.origin);
  setTimeout(() => { if (bar.textContent === 'Loading…') fail('timed out waiting for the decoded image'); }, 120000);
}
</script>
