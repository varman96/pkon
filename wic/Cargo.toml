[package]
name = "pkon-wic"
version = "0.1.0"
edition = "2021"
description = "Windows Imaging Component (WIC) decoder for .pkon files, wrapping the nanoscope PKON2 decoder"
publish = false

# Standalone package: not part of the root package, so the research rig's build is untouched.
[workspace]

[lib]
name = "pkon_wic"
crate-type = ["cdylib", "rlib"]

[dependencies]
nanoscope = { path = ".." }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }

windows-core = "0.61"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


