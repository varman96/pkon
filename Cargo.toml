[package]
name = "nanoscope"
version = "0.1.0"
edition = "2021"
description = "Lossless image compression research rig"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Portable release build: no target-cpu=native on purpose (results must be reproducible
# across machines; revisit per-experiment if SIMD tuning is ever the hypothesis).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Experiment and benchmark binaries live outside src/bin; targets keep their original names (cargo run --bin <name>).
# serve, verify_pkon2_file and verify_x4_promotion stay in src/bin and are auto-discovered.

[[bin]]
name = "bench"
path = "experiments/bin/bench.rs"

[[bin]]
name = "bench25"
path = "benchmarks/pkon2/bench25.rs"

[[bin]]
name = "bench50"
